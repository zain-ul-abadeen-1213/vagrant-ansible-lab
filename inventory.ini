[webservers]
web ansible_host=192.168.56.10 ansible_ssh_private_key_file=/home/user/.ssh/web_key

[dbservers]
db ansible_host=192.168.56.11 ansible_ssh_private_key_file=/home/user/.ssh/db_key

[all:vars]
ansible_user=vagrant
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
ansible_python_interpreter=/usr/bin/python3
